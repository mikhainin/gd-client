[package]
name = "gdrive-ui"
description = "Qt6/QML configuration and status application for the g-client Google Drive sync suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.deb]
maintainer = "g-client contributors"
copyright = "2026, g-client contributors"
license-file = ["../../LICENSE-APACHE", "5"]
extended-description = """\
Qt6/QML desktop control panel for gdrived: lists, adds, removes, and \
enables/disables Google Drive sync folders over D-Bus. Holds no sync \
state itself - gdrived does the actual synchronising."""
section = "net"
priority = "optional"
depends = "$auto, gdrived, qml6-module-qt-labs-platform, qml6-module-qt-labs-folderlistmodel"
recommends = "kdialog"
assets = [
    ["target/release/gdrive-ui", "usr/bin/", "755"],
    ["../../packaging/org.gclient.gdrive-ui.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/gdrive-ui/README.md", "644"],
]

[dependencies]
gdrive-common = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
libc = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true }
