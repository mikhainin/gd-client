name: License compliance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-deny:
    name: cargo-deny (dependency licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  scancode:
    name: ScanCode Toolkit (embedded license/copyright text in our own source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: scripts/scancode-requirements.txt
      - name: Test ScanCode bootstrap
        run: ./scripts/test-scancode-bootstrap.py
      - name: Run ScanCode scan
        run: ./scripts/scancode-scan.sh
      - name: Fail if any license/copyright text was detected in our own source
        run: ./scripts/check-scancode.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scancode-report
          path: .scancode/scancode-report.json
